# DSM 6.2 的内核 cmdline（24.4.0 为型号级，实际按平台分成 4 组）。
cmdline62-4: &cmdline62-4
  HddHotplug: "1"
  SMBusHddDynamicPower: "1"
  syno_hdd_detect: "0"
  syno_hdd_powerup_seq: "0"
  vender_format_version: "2"
  elevator: "elevator"
cmdline62-gemini: &cmdline62-gemini
  HddHotplug: "1"
  intel_iommu: "igfx_off"
  syno_ttyS0: "serial,0x3f8"
  syno_ttyS1: "serial,0x2f8"
  vender_format_version: "2"
  elevator: "elevator"
cmdline62-tty: &cmdline62-tty
  HddHotplug: "1"
  syno_ttyS0: "serial,0x3f8"
  syno_ttyS1: "serial,0x2f8"
  vender_format_version: "2"
  elevator: "elevator"
cmdline62-sas: &cmdline62-sas
  HddHotplug: "1"
  SASmodel: "1"
  syno_ttyS0: "serial,0x3f8"
  syno_ttyS1: "serial,0x2f8"
  vender_format_version: "2"
  elevator: "elevator"
# 6.2 专属 cmdline 键的并集，供从 6.2 切回 7.x 时清理（须覆盖上面 cmdline62-* 的全部键）
cmdline62Keys: ["HddHotplug", "SMBusHddDynamicPower", "syno_hdd_detect", "syno_hdd_powerup_seq", "vender_format_version", "elevator", "intel_iommu", "syno_ttyS0", "syno_ttyS1", "SASmodel"]

