      <<: [*productvers4-71, *productvers4-72, *productvers4-73, *productvers4-74]
  denverton:
    dt: false
    flags: ["movbe"]
    synoinfo: *synoinfo
    synoinfo62: *synoinfo62-denverton
    cmdline62: *cmdline62-4
    models62: ["DS1819+", "DS2419+", "DVA3219", "DVA3221"]
    productvers:
      <<: [*productvers4-62, *productvers4-70, *productvers4-71, *productvers4-72, *productvers4-73, *productvers4-74]
  geminilake:
    dt: true
    noflags: ["x2apic"]
    synoinfo: *synoinfo
    synoinfo62: *synoinfo62-geminilake
    cmdline62: *cmdline62-gemini
    models62: ["DS1520+", "DS220+", "DS720+", "DS920+"]
    productvers:
      <<: [*productvers4-62, *productvers4-70, *productvers4-71, *productvers4-72, *productvers4-73, *productvers4-74]
  purley:
    dt: true
    noflags: ["x2apic"]
    synoinfo:
      <<: *synoinfo
      supportsas: "no"
      supportsas_v2_r1: "no"
