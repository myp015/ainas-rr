    synoinfo62: *synoinfo62-purley
    cmdline62: *cmdline62-sas
    models62: ["FS6400", "HD6500"]
    dom1: ["FS6400", "HD6500"]
    productvers:
      <<: [*productvers4-62, *productvers4-70, *productvers4-71, *productvers4-72, *productvers4-73, *productvers4-74]
  r1000:
    dt: true
    synoinfo: *synoinfo
