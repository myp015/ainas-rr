platforms:
  apollolake:
    dt: false
    flags: ["movbe"]
    noflags: ["x2apic"]
    synoinfo:
      <<: *synoinfo
      HddEnableDynamicPower: "no"
    synoinfo62: *synoinfo62-apollolake
    cmdline62: *cmdline62-4
    models62: ["DS1019+", "DS718+", "DS918+"]
    productvers:
      <<: [*productvers4-62, *productvers4-70, *productvers4-71, *productvers4-72, *productvers4-73, *productvers4-74]
  broadwell:
    dt: false
    synoinfo: *synoinfo
    synoinfo62: *synoinfo62-broadwell
    cmdline62: *cmdline62-4
    models62: ["DS3617xs", "RS3618xs"]
    dom1: ["DS3617xs"]
    productvers:
      <<: [*productvers3-62, *productvers4-70, *productvers4-71, *productvers4-72, *productvers4-73, *productvers4-74]
  broadwellnk:
    dt: false
    synoinfo:
      <<: *synoinfo
      support_bde_internal_10g: "no"
      supportsas: "no"
    synoinfo62: *synoinfo62-broadwellnk
    cmdline62: *cmdline62-4
    models62: ["DS1621xs+", "RS1619xs+", "RS3621xs+", "RS4021xs+", "SA3400", "SA3600"]
    dom1: ["DS1621xs+", "SA3400", "SA3600"]
