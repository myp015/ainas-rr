# DSM 6.2（最后一个支持它的 RR 版本是 24.4.0）。内核版本按平台分两组：
#   4.4.59   apollolake / broadwellnk / broadwellntbap / denverton / geminilake / purley / v1000
#   3.10.105 broadwell
# 对应 LKM 产物名 rp-<platform>-6.2-<kver>-<target>.ko.gz（见 ainas-lkm 的 PLATFORMS）
productvers4-62: &productvers4-62
  "6.2":
    kpre: "6.2"
    kver: "4.4.59"
productvers3-62: &productvers3-62
  "6.2":
    kpre: "6.2"
    kver: "3.10.105"

# DSM 6.2 专用配置（取自 RR 24.4.0 model-configs）。24.4.0 是「型号级」配置且同一型号的 6.2 与 7.x
# 共用一份；本仓库是「平台级」锚点，故 6.2 需要独立的一套，不能沿用上面的 7.x 锚点：
#   - netif_seq 在 6.2 必须显式列出序号（本仓库 7.x 锚点为空）
#   - support_syno_hybrid_raid / supportraidgroup 在 6.2 不写该键（空值 ⇒ _set_conf_kv 删行）
#   - HddEnableDynamicPower 在 6.2 为 yes（apollolake 的 7.x 平台锚点是 no）
# 型号级差异（ext4 / SSD 缓存 / SAS / OOB）见文件末尾的 synoinfo62Models。
synoinfo62-apollolake: &synoinfo62-apollolake
  HddEnableDynamicPower: "yes"
  buzzeroffen: "0xffff"
  maxlanport: "8"
  netif_seq: "0 1 2 3 4 5 6 7"
  support_disk_compatibility: "no"
  support_led_brightness_adjustment: "no"
  support_leds_lp3943: "no"
  support_memory_compatibility: "no"
  support_syno_hybrid_raid:
  support_uasp: "yes"
  supportraidgroup:
