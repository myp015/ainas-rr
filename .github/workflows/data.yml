name: Data
# AiNas: 本工作流负责用「某个 release 的 rr-<TAG>.img.zip」重新生成本仓库 docs/ 下的数据表
# （models / pats / addons / modules / modules_detailed）。
#
# 两种触发方式：
#   1) release: created —— loader 由 ainas-build/ainas-rr.yml 遥控构建，每构建一次就在本仓库
#      创建一个 release；发版后自动用该 release 的镜像刷新 docs 数据并推回 main。
#   2) workflow_dispatch —— 手动跑，版本取「最新一个非 draft release」。
#
# ⚠️ 历史坑（c1ea3ed 曾因此把 release 触发整体删掉）：`release: created` 事件发生在
#    **asset 上传完成之前**，直接下载会拿到 404（2026-10-07~10-19 统计 20 次里 17 次因此失败）。
#    现在改为先用 API 轮询等 asset 出现且体积正常，再下载；最长等 20 分钟。
#    同时用 concurrency 让最新一次 release 接管，避免旧版本任务堆积。
on:
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      data:
        description: "models, pats, addons, modules, modules_detailed"
        default: "11111"
        type: string
      push:
        description: "push"
        default: false
        type: boolean

# release 触发可能连续到来（同一批构建）；只保留最新一次，旧的直接取消
concurrency:
  group: data
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@main
        with:
          ref: main

      - name: Init Env
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          sudo timedatectl set-timezone "Asia/Shanghai"

      - name: Get Data
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          REPO="${GITHUB_REPOSITORY}"

          # 1) 选定版本号：release 触发用事件里的 tag；手动触发取最新一个非 draft release
          if [ "${{ github.event_name }}" = "release" ]; then
            TAG="${{ github.event.release.tag_name }}"
            [ -n "${TAG}" ] || { echo "[E] release 事件里取不到 tag"; exit 1; }
            echo "[INFO] release 触发，版本=${TAG}"
          else
            TAG="$(gh api "repos/${REPO}/releases?per_page=20" --jq '[.[] | select(.draft == false)][0].tag_name')"
            [ -n "${TAG}" ] && [ "${TAG}" != "null" ] || { echo "[E] 取不到最新 release 版本号"; exit 1; }
            echo "[INFO] 手动触发，最新版本=${TAG}"
          fi

          # 2) 等 asset 上传完成：`release: created` 事件早于 asset 上传，直接下载必然 404
          ASSET="rr-${TAG}.img.zip"
          SIZE=0
          for i in $(seq 1 20); do
            # gh api 不支持 jq 的 --arg，这里整段 JSON 交给 jq
            SIZE="$(gh api "repos/${REPO}/releases/tags/${TAG}" 2>/dev/null \
              | jq -r --arg n "${ASSET}" '[.assets[] | select(.name == $n) | .size][0] // 0' 2>/dev/null)"
            case "${SIZE}" in '' | *[!0-9]*) SIZE=0 ;; esac
            echo "[INFO] 等待资产 ${ASSET}（第 ${i}/20 次，size=${SIZE}）"
            [ "${SIZE}" -gt 1048576 ] && break
            sleep 60
          done
          [ "${SIZE}" -gt 1048576 ] || { echo "[E] 等待资产 ${ASSET} 超时（约 20 分钟）"; exit 1; }

          # 3) 下载（网络抖动时重试）
          for i in 1 2 3; do
            rm -f "${ASSET}"
            if gh release download "${TAG}" --repo "${REPO}" --pattern "${ASSET}" --clobber; then
              break
            fi
            echo "[WARN] 下载失败，重试 ${i}/3"
            sleep 60
          done
          [ -f "${ASSET}" ] || { echo "[E] 下载 ${ASSET} 失败"; exit 1; }
          ls -l "${ASSET}"

          unzip "${ASSET}" -d rr rr.img || { echo "[E] 解压 ${ASSET} 失败"; exit 1; }

          sudo apt update
          sudo apt install -y locales busybox dialog gettext sed gawk jq curl 
          sudo apt install -y python-is-python3 python3-pip libelf-dev qemu-utils parted dosfstools cpio xz-utils lz4 lzma bzip2 gzip zstd
          sudo apt install -y build-essential libtool pkgconf libzstd-dev liblzma-dev libssl-dev  # kmodule dependencies

          # Backup the original python3 executable.
          sudo mv -f "$(realpath $(which python3))/EXTERNALLY-MANAGED" "$(realpath $(which python3))/EXTERNALLY-MANAGED.bak" 2>/dev/null || true
          # --ignore-installed：ubuntu-latest 预装的 click 由 debian 包管理、没有 RECORD 文件，
          # pip 走「先卸载再装」会报 uninstall-no-record-file 而失败；忽略已安装版本直接覆盖即可。
          sudo pip3 install -U --ignore-installed -r scripts/requirements.txt

          . scripts/func.sh "${{ secrets.RRORG }}"

          LOOPX=$(sudo losetup -f)
          sudo losetup -P "${LOOPX}" "rr/rr.img"
          rm -rf "/tmp/mnt/p3"
          mkdir -p "/tmp/mnt/p3"
          sudo mount "${LOOPX}p3" "/tmp/mnt/p3"
          unpackInitrd /tmp/mnt/p3/initrd-rr "rr/initrd"

          [ -n "${{ inputs.data }}" ] && DATA="${{ inputs.data }}" || DATA="11111"
          echo "DATA=${DATA}"
          [ "${DATA:0:1}" = "1" ] && python3 scripts/func.py getmodels -w "rr/initrd" -j "docs/models.json" -x "docs/models.xlsx"
          [ "${DATA:1:1}" = "1" ] && python3 scripts/func.py getpats -w "rr/initrd" -j "docs/pats.json" -x "docs/pats.xlsx"
          [ "${DATA:2:1}" = "1" ] && python3 scripts/func.py getaddons -w "/tmp" -j "docs/addons.json" -x "docs/addons.xlsx"
          [ "${DATA:3:1}" = "1" ] && python3 scripts/func.py getmodules -w "/tmp" -j "docs/modules.json" -x "docs/modules.xlsx"
          [ "${DATA:4:1}" = "1" ] && python3 scripts/func.py getmodules -w "/tmp" -j "docs/modules_detailed.json" -x "docs/modules_detailed.xlsx" -d

          sudo umount "/tmp/mnt/p3"
          sudo losetup -d "${LOOPX}"
          rm -rf "/tmp/mnt/p3"

      - name: Upload to Artifacts
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: docs
          path: |
            docs/*.json
            docs/*.xlsx
          retention-days: 5

      - name: Check and Push
        # release 触发一律推送（发版后自动刷新 docs）；手动触发沿用 push 开关
        if: success() && (github.event_name == 'release' || inputs.push == true)
        run: |
          echo "Git push ..."
          # git checkout main
          git pull
          status=$(git status -s | grep -E "docs" | awk '{printf " %s", $2}')
          if [ -n "${status}" ]; then
            git add ${status}
            git commit -m "update $(date +%Y-%m-%d" "%H:%M:%S)"
            git push -f
          fi
